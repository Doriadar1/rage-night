<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הכעס · ערב פאנק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2d87; --hot:#ff1f6d; --rose:#ffe600; --gold:#ffe600; --plum:#111; --ink:#fff;
  --bg1:#141414; --bg2:#2a0012; --bg3:#141414;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:Rubik,system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg1));
  background-size:400% 400%;animation:bgshift 18s ease infinite;min-height:100dvh;
}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* floating hearts layer */
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fh{position:absolute;bottom:-60px;opacity:.75;animation:rise linear forwards;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) rotate(0) scale(var(--s));opacity:0}
  10%{opacity:.85}
  50%{transform:translateY(-55vh) translateX(var(--dx)) rotate(20deg) scale(var(--s))}
  100%{transform:translateY(-115vh) translateX(calc(var(--dx)*-1)) rotate(-20deg) scale(var(--s));opacity:0}
}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff;pointer-events:none;z-index:50;
  box-shadow:0 0 10px #fff,0 0 20px var(--gold)}

main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:22px 16px 40px;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center}

header{text-align:center;margin-top:6px}
.eng{font-family:"Permanent Marker",cursive;font-size:20px;color:var(--gold);text-shadow:0 2px 0 var(--plum);letter-spacing:.5px}
h1{font-family:"Suez One",serif;font-size:clamp(46px,14vw,72px);margin:0;line-height:1;
  background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 var(--hot)) drop-shadow(0 8px 18px rgba(58,10,63,.5));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sub{margin:8px 0 0;font-size:16px;opacity:.95}

/* HOME */
#home{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:26px;width:100%}
.big{
  position:relative;width:min(300px,78vw);aspect-ratio:1/1;border:0;cursor:pointer;background:none;padding:0;
  animation:beat 1.3s ease-in-out infinite;
}
.big svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 26px rgba(120,0,60,.55))}
.big span{position:relative;display:block;font-family:"Suez One",serif;font-size:clamp(34px,10vw,46px);color:#fff;
  text-shadow:0 3px 0 #b3004a,0 0 18px rgba(255,255,255,.6);margin-top:-8%}
.big small{position:relative;display:block;font-size:15px;font-weight:600;opacity:.95;margin-top:4px}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(.98)}42%{transform:scale(1.05)}70%{transform:scale(1)}}
.big:active{animation:none;transform:scale(.94)}
.row{display:flex;gap:14px;width:100%;justify-content:center}
.small{
  flex:1;max-width:200px;border:0;border-radius:999px;padding:16px 10px;cursor:pointer;
  font-family:"Suez One",serif;font-size:22px;color:var(--plum);
  background:linear-gradient(180deg,#ff8cc0,var(--pink));color:#fff;box-shadow:0 6px 0 #7a0035,0 12px 22px rgba(58,10,63,.35);
  transition:transform .15s}
.small.up{background:linear-gradient(180deg,#fff59a,var(--gold));color:#111;box-shadow:0 6px 0 #8a7a00,0 12px 22px rgba(58,10,63,.35)}
.small:active{transform:translateY(4px);box-shadow:0 2px 0 #c2307a}
.small em{font-style:normal;display:block;font-family:Rubik;font-size:13px;font-weight:600;opacity:.75}
.count{font-size:14px;opacity:.85;text-align:center}

/* RESULT — full screen photo */
#result{display:none;position:fixed;inset:0;z-index:20;background:#0a0a0a;overflow:hidden}
.card{position:absolute;inset:0;display:block;overflow:hidden;cursor:pointer;color:#fff;text-decoration:none}
.bg{position:absolute;inset:-60px;background-size:cover;background-position:center;
  filter:blur(30px) brightness(.55) saturate(1.4)}
.card img{position:absolute;top:0;left:0;width:100%;height:min(100dvh,132vw);object-fit:cover;object-position:50% 40%;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent);
  animation:kenburns 14s ease-in-out infinite alternate;transform-origin:50% 30%}
@media (min-aspect-ratio:4/5){.card img{height:100%;object-fit:contain;-webkit-mask-image:none;mask-image:none}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.05)}}
.card.enter{animation:zoomin .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes zoomin{0%{transform:scale(1.25);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
.cap{position:absolute;inset:auto 0 0 0;padding:90px 20px calc(110px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(8,8,8,.97),rgba(8,8,8,.75) 55%,transparent)}
.song{font-family:"Suez One",serif;font-size:clamp(28px,8.5vw,44px);line-height:1.1;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.song.ltr{direction:ltr;text-align:left}
.artist{font-size:17px;margin:8px 0 0;opacity:.95}
.artist.ltr{direction:ltr;text-align:left}
.tap{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 14px;border-radius:999px;
  background:rgba(255,255,255,.2);backdrop-filter:blur(4px);font-weight:600;font-size:15px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{background:rgba(255,255,255,.38)}}
.mode{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;
  font-family:"Permanent Marker",cursive;font-size:19px;color:var(--gold);text-shadow:0 2px 0 var(--plum),0 0 12px rgba(0,0,0,.6)}
.another{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;
  border:0;border-radius:999px;padding:16px 32px;cursor:pointer;font-family:"Suez One",serif;font-size:25px;color:#fff;
  background:linear-gradient(180deg,#fff59a,var(--gold));color:#111;box-shadow:0 6px 0 #8a7a00,0 14px 26px rgba(0,0,0,.45)}
.another:active{transform:translate(-50%,4px);box-shadow:0 2px 0 #9e0040}
.back{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;border:0;border-radius:999px;cursor:pointer;
  padding:8px 14px;font:600 15px Rubik;color:#fff;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}

footer{margin-top:auto;padding-top:26px;font-size:13px;opacity:.8;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="sky"></div>
<main>
  <header>
    <div class="eng">Rage Night · Tel Aviv</div>
    <h1>הכעס</h1>
    <p class="sub">נגד המערכת · נגד ביבי · נגד כולם ✊</p>
  </header>

  <section id="home">
    <button class="big" id="goAll" aria-label="תביא שיר">
      <svg viewBox="0 0 100 94" aria-hidden="true"><defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d9a"/><stop offset="1" stop-color="#b8003f"/></linearGradient>
        <radialGradient id="hl" cx=".3" cy=".25" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
        <path d="M50 2 L61 30 L92 18 L72 44 L98 60 L66 62 L70 92 L50 70 L30 92 L34 62 L2 60 L28 44 L8 18 L39 30Z" fill="url(#hg)" stroke="#ffe600" stroke-width="3" stroke-linejoin="round"/>
        <path d="M50 2 L61 30 L92 18 L72 44 L98 60 L66 62 L70 92 L50 70 L30 92 L34 62 L2 60 L28 44 L8 18 L39 30Z" fill="url(#hl)"/>
      </svg>
      <span>תביא שיר</span><small>🤘 אחד אקראי 🤘</small>
    </button>
    <div class="row">
      <button class="small up" id="goUp">תביא פוגו<em>⚡ מהיר ⚡</em></button>
      <button class="small" id="goSlow">תביא כבד<em>🎸 איטי ועצבני 🎸</em></button>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section id="result">
    <a class="card" id="card" target="_blank" rel="noopener">
      <div class="bg" id="bg"></div>
      <img id="photo" alt="">
      <div class="cap">
        <p class="song" id="song"></p>
        <p class="artist" id="artist"></p>
        <span class="tap" id="tap">👆 לחיצה על התמונה → אקורדים</span>
      </div>
    </a>
    <div class="mode" id="mode"></div>
    <button class="another" id="another">תביא עוד אחד 🔥</button>
    <button class="back" id="back">→ חזרה</button>
  </section>

  <footer>ערב ג׳אם · 2026 · יאללה בלגן 🏴</footer>
</main>

<script>
const DATA = {"songs": [{"id": 1, "title": "Iron Man", "artist": "Black Sabbath", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/black-sabbath/iron-man-chords-3261149"}, {"id": 2, "title": "Don't Bring Me Down", "artist": "Electric Light Orchestra", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/electric-light-orchestra/dont-bring-me-down-chords-139891"}, {"id": 3, "title": "In Bloom", "artist": "Nirvana", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/nirvana/in-bloom-chords-1171571"}, {"id": 4, "title": "You Oughta Know", "artist": "Alanis Morissette", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/alanis-morissette/you-oughta-know-chords-352404"}, {"id": 5, "title": "Basket Case", "artist": "Green Day", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/green-day/basket-case-chords-955966"}, {"id": 6, "title": "Song 2", "artist": "Blur", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/blur/song-2-chords-1050059"}, {"id": 7, "title": "Welcome to the Jungle", "artist": "Guns N' Roses", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/guns-n-roses/welcome-to-the-jungle-chords-1941985"}, {"id": 8, "title": "Bullet with Butterfly Wings", "artist": "The Smashing Pumpkins", "tempo": "slow", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-smashing-pumpkins/bullet-with-butterfly-wings-chords-92367"}, {"id": 9, "title": "I Fought the Law", "artist": "The Clash", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-clash/i-fought-the-law-chords-63686"}, {"id": 10, "title": "Seven Nation Army", "artist": "The White Stripes", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-white-stripes/seven-nation-army-chords-52559"}, {"id": 11, "title": "Revolution", "artist": "The Beatles", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-beatles/revolution-chords-1051645"}, {"id": 12, "title": "Sabotage", "artist": "Beastie Boys", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/beastie-boys/sabotage-chords-3688055"}, {"id": 13, "title": "Anarchy in the UK", "artist": "Sex Pistols", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/sex-pistols/anarchy-in-the-uk-chords-1083828"}, {"id": 14, "title": "Youth Against Fascism", "artist": "Sonic Youth", "tempo": "up", "level": 3, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/sonic-youth/youth-against-fascism-chords-1719591"}, {"id": 15, "title": "Don't Stop Me Now", "artist": "Queen", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/queen/dont-stop-me-now-chords-519549"}, {"id": 16, "title": "Killing in the Name", "artist": "Rage Against the Machine", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/rage-against-the-machine/killing-in-the-name-chords-1792869"}, {"id": 17, "title": "I Just Don't Know What to Do with Myself", "artist": "The White Stripes", "tempo": "slow", "level": 3, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-white-stripes/i-just-dont-know-what-to-do-with-myself-chords-91612"}, {"id": 18, "title": "Fell on Black Days", "artist": "Soundgarden", "tempo": "slow", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/soundgarden/fell-on-black-days-chords-1681009"}, {"id": 19, "title": "Come as You Are", "artist": "Nirvana", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/nirvana/come-as-you-are-chords-1202432"}, {"id": 20, "title": "Just", "artist": "Radiohead", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/radiohead/just-chords-196011"}, {"id": 21, "title": "סוף הדרך", "artist": "רוקפור", "tempo": "slow", "level": 2, "he": true, "chords": "https://www.tab4u.com/tabs/songs/2307_%D7%A8%D7%95%D7%A7%D7%A4%D7%95%D7%A8_-_%D7%A1%D7%95%D7%A3_%D7%94%D7%93%D7%A8%D7%9A.html"}, {"id": 22, "title": "Hate to Say I Told You So", "artist": "The Hives", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-hives/hate-to-say-i-told-you-so-chords-631221"}, {"id": 23, "title": "God Save the Queen", "artist": "Sex Pistols", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/sex-pistols/god-save-the-queen-chords-1083650"}, {"id": 24, "title": "Paranoid", "artist": "Black Sabbath", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/black-sabbath/paranoid-chords-1167469"}, {"id": 25, "title": "הכעס", "artist": "רוקפור", "tempo": "up", "level": 2, "he": true, "chords": "https://www.tab4u.com/tabs/songs/2310_%D7%A8%D7%95%D7%A7%D7%A4%D7%95%D7%A8_-_%D7%94%D7%9B%D7%A2%D7%A1.html"}, {"id": 26, "title": "Blitzkrieg Bop", "artist": "Ramones", "tempo": "up", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/ramones/blitzkrieg-bop-chords-1431341"}, {"id": 27, "title": "Black Hole Sun", "artist": "Soundgarden", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/soundgarden/black-hole-sun-chords-1102770"}, {"id": 28, "title": "The Man Who Sold the World", "artist": "Nirvana", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/nirvana/the-man-who-sold-the-world-chords-651988"}, {"id": 29, "title": "Come Together", "artist": "The Beatles", "tempo": "slow", "level": 1, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/the-beatles/come-together-chords-17413"}, {"id": 30, "title": "Live and Let Die", "artist": "Guns N' Roses", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/guns-n-roses/live-and-let-die-chords-726297"}, {"id": 31, "title": "Rooster", "artist": "Alice in Chains", "tempo": "slow", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/alice-in-chains/rooster-chords-1678491"}, {"id": 32, "title": "Bombtrack", "artist": "Rage Against the Machine", "tempo": "up", "level": 3, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/rage-against-the-machine/bombtrack-tabs-25460"}, {"id": 33, "title": "Richard III", "artist": "Supergrass", "tempo": "up", "level": 3, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/supergrass/richard-iii-chords-2837087"}, {"id": 34, "title": "Give It Away", "artist": "Red Hot Chili Peppers", "tempo": "up", "level": 2, "he": false, "chords": "https://tabs.ultimate-guitar.com/tab/red-hot-chili-peppers/give-it-away-chords-1989635"}], "photos": ["01_dori_hadas_roni.jpg", "02_ben_gulli_avi.jpg", "03_joker_tsvia_ran.jpg", "04_shuki_dvorka_ariel.jpg", "05_roni_gulli_dori.jpg", "06_avi_hadas_shuki.jpg", "07_ran_dvorka_ben.jpg", "08_tsvia_joker_ariel.jpg", "09_dori_shuki_gulli.jpg", "10_hadas_roni_avi.jpg", "11_gulli_joker_dvorka.jpg", "12_ben_tsvia_dori.jpg", "13_ariel_ran_hadas.jpg", "14_joker_avi_roni_tsvia.jpg", "15_dvorka_shuki_ariel_ran.jpg"]};
const BASE = "covers/";
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// played songs are remembered so nothing repeats until the whole pool is used
let played = new Set(store.get("punk.played") || []);
let photoQ = [];
let mode = "all";

function pool(m){ return DATA.songs.filter(s => m === "all" || s.tempo === m); }
// rhythm: each round is 2-3 easy + 2-3 medium (shuffled), then 1 hard / less-known song
const plans = {};
function newRound(){
  const r = () => 2 + Math.floor(Math.random() * 2);
  return shuffle([...Array(r()).fill(1), ...Array(r()).fill(2)]).concat([3]);
}
const FALLBACK = {1: [1, 2, 3], 2: [2, 1, 3], 3: [3, 2, 1]};
function nextSong(m){
  if (!plans[m] || !plans[m].length) plans[m] = newRound();
  const want = plans[m].shift();
  let left = pool(m).filter(s => !played.has(s.id));
  if (!left.length) { pool(m).forEach(s => played.delete(s.id)); left = pool(m); }
  let pick = [];
  for (const lv of FALLBACK[want]) { pick = left.filter(s => s.level === lv); if (pick.length) break; }
  const s = pick[Math.floor(Math.random() * pick.length)];
  played.add(s.id); store.set("punk.played", [...played]);
  return s;
}
function nextPhoto(){
  if (!photoQ.length) photoQ = shuffle(DATA.photos);
  return photoQ.pop();
}
const isHe = t => /[֐-׿]/.test(t);
const LABEL = {all: "✊ שיר אקראי ✊", up: "⚡ פוגו ⚡", slow: "🎸 כבד 🎸"};

function show(m){
  mode = m;
  const s = nextSong(m), p = nextPhoto();
  $("mode").textContent = LABEL[m];
  $("photo").src = BASE + p; $("bg").style.backgroundImage = `url("${BASE + p}")`;
  $("song").textContent = s.title; $("song").className = "song" + (isHe(s.title) ? "" : " ltr");
  $("artist").textContent = "🎤 " + s.artist; $("artist").className = "artist" + (isHe(s.artist) ? "" : " ltr");
  $("card").href = s.chords;
  $("tap").textContent = s.video ? "👆 לחיצה על התמונה → לשיר (אין אקורדים ברשת)" : "👆 לחיצה על התמונה → אקורדים";
  $("home").style.display = "none"; $("result").style.display = "block"; document.body.style.overflow = "hidden";
  const c = $("card"); c.classList.remove("enter"); void c.offsetWidth; c.classList.add("enter");
  window.scrollTo({top: 0, behavior: "smooth"});
  updateCount();
}
function updateCount(){
  const left = DATA.songs.filter(s => !played.has(s.id)).length;
  $("count").textContent = `${DATA.songs.length} שירים · נשארו ${left} שעוד לא שרנו`;
}

// heart burst on every tap
function burst(x, y){
  const em = ["🤘","⚡","💥","🔥","✊","🏴"];
  for (let i = 0; i < 14; i++) {
    const d = document.createElement("div");
    d.textContent = em[i % em.length];
    d.style.cssText = `position:fixed;left:${x}px;top:${y}px;font-size:${18+Math.random()*16}px;pointer-events:none;z-index:60;transition:transform .9s cubic-bezier(.1,.8,.3,1),opacity .9s`;
    document.body.appendChild(d);
    const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 110;
    requestAnimationFrame(() => { d.style.transform = `translate(${Math.cos(a)*r}px,${Math.sin(a)*r - 40}px) rotate(${Math.random()*80-40}deg)`; d.style.opacity = 0; });
    setTimeout(() => d.remove(), 950);
  }
}
function go(m){ return e => { burst(e.clientX || innerWidth/2, e.clientY || innerHeight/2); setTimeout(() => show(m), 220); }; }
$("goAll").onclick = go("all"); $("goUp").onclick = go("up"); $("goSlow").onclick = go("slow");
$("another").onclick = e => { burst(e.clientX, e.clientY); show(mode); };
$("back").onclick = () => { $("result").style.display = "none"; document.body.style.overflow = ""; $("home").style.display = "flex"; };
$("card").addEventListener("click", e => burst(e.clientX, e.clientY));

// floating hearts in the sky
const sky = $("sky"), HEARTS = ["⚡","🔥","✊","🤘","💥","⛓️","🏴"];
function spawn(){
  const h = document.createElement("div");
  h.className = "fh"; h.textContent = HEARTS[Math.floor(Math.random()*HEARTS.length)];
  const dur = 9 + Math.random() * 9;
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (16 + Math.random() * 26) + "px";
  h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
  h.style.setProperty("--s", (0.6 + Math.random() * 0.8).toFixed(2));
  h.style.animationDuration = dur + "s";
  sky.appendChild(h); setTimeout(() => h.remove(), dur * 1000);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { for (let i = 0; i < 8; i++) setTimeout(spawn, i * 500); setInterval(spawn, 900); }

// preload photos
DATA.photos.forEach(p => { const i = new Image(); i.src = BASE + p; });
updateCount();
</script>
</body>
